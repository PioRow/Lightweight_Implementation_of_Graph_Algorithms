name: Compile and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.12]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev
    - name: Install STC dependency
      run: |
        git clone --depth 1 https://github.com/tylov/STC.git
        sudo cp -r STC/include/stc /usr/include/

    - name: Install Python dependencies
      run: |
        python3 -m venv pyvenv
        source pyvenv/bin/activate
        python3 -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        python3 -m pip install pytest numpy>=2.0.0 setuptools wheel --upgrade
    - name: Build and test
      run: |
        source pyvenv/bin/activate
        python3 -m pip install LIGA/.
        pytest 